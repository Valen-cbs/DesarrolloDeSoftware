services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  db-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: m9
      POSTGRES_PASSWORD: m9_local
      POSTGRES_DB: m9_test
    ports:
      - "5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m9 -d m9_test"]
      interval: 2s
      timeout: 3s
      retries: 20
