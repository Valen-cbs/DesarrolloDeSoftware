services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: grupo9/m9-reservas:0.1.0
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Base de datos SOLO para las pruebas (no toca Supabase).
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m9_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro